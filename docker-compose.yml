services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-commhub}
      MYSQL_USER: ${DATABASE_USERNAME:-commhub}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-commhub}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOSTNAME: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-commhub}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-commhub}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-commhub}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LIMESURVEY_RPC_URL: ${LIMESURVEY_RPC_URL:-}
      LIMESURVEY_PUBLIC_URL: ${LIMESURVEY_PUBLIC_URL:-}
      LIMESURVEY_USERNAME: ${LIMESURVEY_USERNAME:-}
      LIMESURVEY_PASSWORD: ${LIMESURVEY_PASSWORD:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time - this is the URL the *browser*
        # will call, so it must be reachable from the user's machine, not just
        # from inside the Docker network (localhost:8000 assumes the backend
        # port is published to the host, as it is above).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
