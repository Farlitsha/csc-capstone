<!DOCTYPE html>
<html>

<head>

    <title>Community Hub - Adverts</title>

    <link rel="stylesheet" href="/static/style_adverts.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        Community Hub
    </div>

    <div class="nav-buttons">

        <span class="username">
            Welcome, {{ username }}
        </span>

        <a href="/home" class="nav-button">Home</a>

        <a href="/search" class="nav-button">Search</a>

        <a href="/logout" class="nav-button">Logout</a>

    </div>

</header>

<h1>Community Adverts</h1>
<div class="adverts-container">

    {% for advert in adverts %}

        <div class="advert-card">

            <div class="advert-image">
                <img src="{{ advert.image }}" alt="{{ advert.title }}">
            </div>

            <div class="advert-content">

                <span class="service-type {{ advert.service_type | lower }}">
                    {{ advert.service_type }}
                </span>

                <h2>{{ advert.title }}</h2>

                <p class="category">
                    {{ advert.category }}
                </p>

                <p>
                    Posted by: {{ advert.posted_by }}
                </p>

                <p class="description">
                    {{ advert.description }}
                </p>

                <p class="amount">
                    R{{ "%.2f"|format(advert.amount) }}
                </p>

                <div class="advert-buttons">
                    <button type="button">
                        View More
                    </button>

                    <button type="button">
                        Contact
                    </button>
                </div>

            </div>

        </div>

    {% endfor %}

</div>

</body>

</html>
