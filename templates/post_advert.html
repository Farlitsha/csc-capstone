<!DOCTYPE html>
<html>

<head>
    <title>Post Advert</title>
    <link rel="stylesheet" href="/static/style_post_advert.css">
</head>

<body>

    <h1>Create Advert</h1>

    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}

    <form action="/post_advert" method="post" enctype="multipart/form-data">

        <!-- choosing whether they're are offering a service or requesting one-->
        <div class="radio-group">

            <label>
                <input
                    type="radio"
                    name="service_type"
                    value="offering"
                    required
                >
                Offering a Service
            </label>

            <label>
                <input
                    type="radio"
                    name="service_type"
                    value="requesting"
                >
                Requesting a Service
            </label>
        </div> 
        
        <label for="title">
            Title
        </label>

        <input
            type="text"
            id="title"
            name="title"
            required
        >

        <label for="content">
            Content
        </label>

        <textarea
            id="content"
            name="content"
            rows="8"
            required
        ></textarea>

        <label for="category">
            Category
        </label>

        <select
            id="category"
            name="category"
            required
        >
            <option value="">Select a category</option>
            <option value="education">Education</option>
            <option value="volunteering">Volunteering</option>
            <option value="research">Research</option>
            <option value="other">Other</option>
        </select>

        <label for="amount">
            Amount (R)
        </label>

        <input
            type="number"
            id="amount"
            name="amount"
            min="0"
            step="0.01"
            placeholder="0.00"
        >

        <label for="image">
            Image (optional)
        </label>

        <input
            type="file"
            id="image"
            name="image"
            accept="image/*"
        >

        <button type="submit">
            Post Advert
        </button>

    </form>

    <a href="/home" class="nav-button">
        Back to Home
    </a>

</body>

</html>
