<!DOCTYPE html>
<html>

<head>
    <title>Create User</title>
    <link rel="stylesheet" href="/static/style_register.css">
</head>

<body>

    <h1>Create New User</h1>

    {% if message %}
        <p class="warning">{{ message }}</p>
    {% endif %}

    <form action="/register" method="post">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <a href="/login" class="nav-button">
        Back to Login
    </a>

</body>

</html>
