<!DOCTYPE html>
<html lang="{{ lang }}">

<head>
    <title>{{ t("login.create_account") }}</title>
    <link rel="stylesheet" href="/static/style_register.css">
</head>

<body>

    <div class="lang-toggle">
        {% if lang == "en" %}
            <a href="/set-language/af">🇿🇦 {{ t("language.afrikaans") }}</a>
        {% else %}
            <a href="/set-language/en">🇬🇧 {{ t("language.english") }}</a>
        {% endif %}
    </div>

    <h1>{{ t("login.create_account") }}</h1>

    {% if message %}
        <p class="warning">{{ message }}</p>
    {% endif %}

    <form action="/register" method="post">

        <label for="Name">{{ t("profile.name_label") }}</label>
        <input type="text" id="Name" name="Name" required>

        <label for="Surname">{{ t("profile.surname_label") }}</label>
        <input type="text" id="Surname" name="Surname" required>

        <label for="email">{{ t("profile.email_label") }}</label>
        <input type="email" id="email" name="email" required>

        <label for="password">{{ t("login.password_label") }}</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">{{ t("login.create_account") }}</button>

    </form>

    <a href="/login" class="nav-button">{{ t("login.back_to_login") }}</a>

</body>
</html>
