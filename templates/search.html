<!DOCTYPE html>
<html>

<head>
    <title>Search</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>Search users, posts,...</h1>

<form action="/search" method="post">

    <input
        type="text"
        name="query"
        value="{{ query }}"
        placeholder="Search..."
    >

    <button type="submit">
        Search
    </button>

</form>

<hr>

{% if results %}

    {% for result in results %}

        <div class="result">

            <h3>{{ result.title }}</h3>

            <p>{{ result.description }}</p>

        </div>

    {% endfor %}

{% endif %}

</body>

</html>
